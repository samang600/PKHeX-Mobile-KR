# iOS 빌드 (서명 없는 IPA) — GitHub의 맥 서버에서 빌드
# 실행: 저장소 Actions 탭 → "iOS 빌드" → Run workflow
# 릴리스를 발행(Publish)하면 자동으로 빌드해서 그 릴리스에 IPA를 첨부합니다.
#
# 최신 .NET iOS 도구(27.x)는 Xcode 27이 필요한데, GitHub 맥 서버의 Xcode는 서버마다 26.3~26.5로 다름.
# (워크로드 세트 버전 표기: 패키지 10.303.1 = CLI 10.0.303.1, 10.201.0 = 10.0.201)
# → 서버에 있는 Xcode 버전을 보고, 그에 맞는 .NET SDK + 워크로드 세트를 골라 별도 폴더에 설치해서 빌드.
#   Xcode 26.5 이상 : SDK 10.0.303 + 워크로드 10.0.303.1 → net10.0-ios26.5
#   Xcode 26.4      : SDK 10.0.204 + 워크로드 10.0.204.1 → net10.0-ios26.4
#   Xcode 26.2~26.3 : SDK 10.0.201 + 워크로드 10.0.201   → net10.0-ios26.2
#   워크로드에는 여러 iOS 버전 도구가 함께 깔리므로(27.0 미리보기 포함), 빌드할 iOS 버전을 명시해서 고름.
#   (MAUI 10.0.90·CommunityToolkit 15는 iOS 26.0 이상이면 됨)
name: iOS 빌드

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: 설정 확인 (iOS 빌드 설정 v12)
        run: |
          echo "=== iOS 빌드 설정 v12 (Xcode 맞춤 .NET 별도 설치) ==="
          echo "커밋: $GITHUB_SHA  /  이벤트: $GITHUB_EVENT_NAME  /  브랜치·태그: $GITHUB_REF"

      - name: Xcode 선택과 맞는 .NET 버전 결정
        run: |
          echo "설치된 Xcode:"; ls -d /Applications/Xcode*.app
          # 서버에 따라 일부 Xcode는 구성 요소(MacOSX SDK, iOS SDK, actool 등)가 빠져 있음 → 실제로 쓸 수 있는지 검사해서 고름
          ok() {
            local X="$1"
            [ -d "$X/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ] || { echo "  제외 $X: MacOSX SDK 없음"; return 1; }
            DEVELOPER_DIR="$X/Contents/Developer" xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1 || { echo "  제외 $X: iOS SDK 없음"; return 1; }
            DEVELOPER_DIR="$X/Contents/Developer" xcrun -find actool >/dev/null 2>&1 || { echo "  제외 $X: actool 없음"; return 1; }
            DEVELOPER_DIR="$X/Contents/Developer" xcrun -find ibtool >/dev/null 2>&1 || { echo "  제외 $X: ibtool 없음"; return 1; }
            DEVELOPER_DIR="$X/Contents/Developer" xcrun -sdk "$X/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" -find clang >/dev/null 2>&1 || { echo "  제외 $X: clang 없음"; return 1; }
            return 0
          }
          XC=""
          # 1순위: 26.5 (빌드 도구가 맞춰진 버전) → 2순위: 그 밖의 26.x 최신순
          for X in $(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | grep -v -i beta | sort -Vr) $(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -Vr); do
            if ok "$X"; then XC="$X"; break; fi
          done
          [ -z "$XC" ] && { echo "::error::쓸 수 있는 Xcode 26.x가 없습니다"; exit 1; }
          sudo xcode-select -s "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $GITHUB_ENV
          export DEVELOPER_DIR="$XC/Contents/Developer"
          sudo xcodebuild -license accept >/dev/null 2>&1 || true
          sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true
          MSDK="$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          for T in clang clang++ ld ar strip dsymutil lipo actool ibtool codesign_allocate; do
            xcrun -sdk "$MSDK" -find $T >/dev/null 2>&1 || true
            xcrun --sdk macosx -find $T >/dev/null 2>&1 || true
            xcrun --sdk iphoneos -find $T >/dev/null 2>&1 || true
          done
          echo "clang: $(xcrun -sdk "$MSDK" -find clang)"
          XV=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "선택: $XC (Xcode $XV)"; xcrun --sdk iphoneos --show-sdk-version
          MAJ=$(echo "$XV" | cut -d. -f1); MIN=$(echo "$XV" | cut -d. -f2); MIN=${MIN:-0}
          if [ "$MAJ" -ge 27 ] || { [ "$MAJ" -eq 26 ] && [ "$MIN" -ge 5 ]; }; then SDK=10.0.303; WS=10.0.303.1; IOSV=26.5
          elif [ "$MAJ" -eq 26 ] && [ "$MIN" -ge 4 ]; then SDK=10.0.204; WS=10.0.204.1; IOSV=26.4
          else SDK=10.0.201; WS=10.0.201; IOSV=26.2; fi
          echo "사용: .NET SDK $SDK + 워크로드 세트 $WS + iOS $IOSV (net10.0-ios$IOSV)"
          echo "PIN_SDK=$SDK" >> $GITHUB_ENV
          echo "PIN_WS=$WS" >> $GITHUB_ENV
          echo "PIN_IOSV=$IOSV" >> $GITHUB_ENV
          echo "IOS_TFM=net10.0-ios$IOSV" >> $GITHUB_ENV

      - name: .NET SDK 설치 (별도 폴더, 버전 고정)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --version "$PIN_SDK" --install-dir "$HOME/dotnet-pinned"
          echo "DN=$HOME/dotnet-pinned/dotnet" >> $GITHUB_ENV
          echo "DOTNET_ROOT=$HOME/dotnet-pinned" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $GITHUB_ENV

      - name: MAUI iOS 워크로드 설치 (버전 고정)
        run: |
          "$DN" --version
          "$DN" workload install maui-ios --version "$PIN_WS"
          "$DN" workload --version
          "$DN" workload list
          echo "설치된 iOS 도구:"; ls "$HOME/dotnet-pinned/packs" | grep -i "Microsoft.iOS.Sdk" || true
          # 워크로드에는 여러 iOS 버전 도구가 함께 들어 있음(27.0 미리보기 포함, 정상).
          # 빌드는 아래에서 net10.0-ios$PIN_IOSV 로 버전을 명시해 그 도구만 쓰게 함 → 그 도구가 있는지만 확인
          if ! ls "$HOME/dotnet-pinned/packs" | grep -qx "Microsoft.iOS.Sdk.net10.0_${PIN_IOSV}"; then echo "::error::iOS ${PIN_IOSV} 도구가 없음"; exit 1; fi
          echo "빌드에 쓸 iOS 도구: Microsoft.iOS.Sdk.net10.0_${PIN_IOSV}"

      - name: 빌드 (서명 없음)
        run: |
          B() { "$DN" build PKHeXKR/PKHeXKR.csproj -c Release -f "$IOS_TFM" -r ios-arm64 -p:IosOnly=true -p:IosTfm="$IOS_TFM" \
                -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:BuildIpa=false "$@"; }
          B && exit 0
          echo "::warning::빌드 실패 → 한 번 더 시도 (이미 끝난 단계는 건너뜀)"
          B && exit 0
          echo "::warning::다시 실패 → 동시 작업을 1개로 줄여 마지막 시도"
          B -m:1 -p:BuildInParallel=false

      - name: IPA 만들기
        run: |
          APP=$(find PKHeXKR/bin/Release -path "*ios-arm64/*.app" -maxdepth 4 -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "::error::.app을 찾지 못함"; find PKHeXKR/bin -maxdepth 4 -type d; exit 1; }
          echo "앱: $APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          VER=$(grep -o '<ApplicationDisplayVersion>[^<]*' PKHeXKR/PKHeXKR.csproj | sed 's/.*>//')
          zip -qry "PKHeX_Mobile_iOS_v${VER}_unsigned.ipa" Payload
          ls -la *.ipa

      - name: 결과 파일 보관 (Actions 실행 화면에서 받기)
        uses: actions/upload-artifact@v5
        with:
          name: PKHeX_Mobile_iOS_unsigned
          path: "*.ipa"

      - name: 릴리스에 첨부 (릴리스 발행으로 실행된 경우)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipa"
