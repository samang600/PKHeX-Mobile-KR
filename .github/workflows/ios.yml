# iOS 빌드 (서명 없는 IPA) — GitHub의 맥 서버에서 빌드
# 실행: 저장소 Actions 탭 → "iOS 빌드" → Run workflow
# 릴리스를 발행(Publish)하면 자동으로 빌드해서 그 릴리스에 IPA를 첨부합니다.
#
# 최신 .NET iOS 도구(27.x)는 Xcode 27이 필요한데, GitHub 맥 서버의 Xcode는 서버마다 26.3~26.5로 다름.
# → 서버에 있는 Xcode 버전을 보고, 그에 맞는 .NET SDK + 워크로드 세트를 골라 별도 폴더에 설치해서 빌드.
#   Xcode 26.5 이상 : SDK 10.0.303 + 워크로드 10.303.1 (iOS 26.5)
#   Xcode 26.4      : SDK 10.0.204 + 워크로드 10.204.1 (iOS 26.4)
#   Xcode 26.2~26.3 : SDK 10.0.201 + 워크로드 10.201.0 (iOS 26.2)
#   (MAUI 10.0.90·CommunityToolkit 15는 iOS 26.0 이상이면 됨)
name: iOS 빌드

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 선택과 맞는 .NET 버전 결정
        run: |
          echo "설치된 Xcode:"; ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          XV=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "선택: $XC (Xcode $XV)"
          MAJ=$(echo "$XV" | cut -d. -f1); MIN=$(echo "$XV" | cut -d. -f2); MIN=${MIN:-0}
          if [ "$MAJ" -ge 27 ] || { [ "$MAJ" -eq 26 ] && [ "$MIN" -ge 5 ]; }; then SDK=10.0.303; WS=10.303.1
          elif [ "$MAJ" -eq 26 ] && [ "$MIN" -ge 4 ]; then SDK=10.0.204; WS=10.204.1
          else SDK=10.0.201; WS=10.201.0; fi
          echo "사용: .NET SDK $SDK + 워크로드 세트 $WS"
          echo "PIN_SDK=$SDK" >> $GITHUB_ENV
          echo "PIN_WS=$WS" >> $GITHUB_ENV

      - name: .NET SDK 설치 (별도 폴더, 버전 고정)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --version "$PIN_SDK" --install-dir "$HOME/dotnet-pinned"
          echo "$HOME/dotnet-pinned" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$HOME/dotnet-pinned" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $GITHUB_ENV

      - name: MAUI iOS 워크로드 설치 (버전 고정)
        run: |
          which dotnet; dotnet --version
          dotnet workload install maui-ios --version "$PIN_WS"
          dotnet workload --version
          dotnet workload list
          ls "$HOME/dotnet-pinned/packs" | grep -i ios || true

      - name: 빌드 (서명 없음)
        run: >
          dotnet build PKHeXKR/PKHeXKR.csproj -c Release -f net10.0-ios -r ios-arm64 -p:IosOnly=true
          -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:BuildIpa=false

      - name: IPA 만들기
        run: |
          APP=$(find PKHeXKR/bin/Release/net10.0-ios/ios-arm64 -maxdepth 1 -name "*.app" | head -1)
          echo "앱: $APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          VER=$(grep -o '<ApplicationDisplayVersion>[^<]*' PKHeXKR/PKHeXKR.csproj | sed 's/.*>//')
          zip -qry "PKHeX_Mobile_iOS_v${VER}_unsigned.ipa" Payload
          ls -la *.ipa

      - name: 결과 파일 보관 (Actions 실행 화면에서 받기)
        uses: actions/upload-artifact@v5
        with:
          name: PKHeX_Mobile_iOS_unsigned
          path: "*.ipa"

      - name: 릴리스에 첨부 (릴리스 발행으로 실행된 경우)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipa"
